name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          DEST=$(xcodebuild -showdestinations -scheme MoodNote -project MoodNote.xcodeproj 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep 'OS:' | head -1 \
            | sed -n 's/.*id:\([^,}]*\).*/\1/p' || true)
          if [ -z "$DEST" ]; then
            xcodebuild \
              -project MoodNote.xcodeproj \
              -scheme MoodNote \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project MoodNote.xcodeproj \
              -scheme MoodNote \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "id=$DEST" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
